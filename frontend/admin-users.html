<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de accesos — GeoVisor San Andrés</title>
  <link rel="stylesheet" href="src/auth/login.css" />
  <link rel="stylesheet" href="src/js/admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="admin-header-left">
      <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al mapa
      </a>
      <h1><i class="fas fa-users-cog"></i> Gestión de accesos</h1>
    </div>
    <div class="admin-header-right">
      <div class="user-chip-sm">
        <span data-user-nombre></span>
        <em data-user-rol></em>
      </div>
      <button id="btnLogout" class="btn-sm btn-danger" data-logout>
        <i class="fas fa-sign-out-alt"></i> Salir
      </button>
    </div>
  </header>

  <main class="admin-main">

    <div class="admin-toolbar">
      <input id="searchInput" type="search" class="search-input"
             placeholder="Buscar por nombre o correo…" />
      <button id="btnNewUser" class="btn-sm btn-primary">
        <i class="fas fa-user-plus"></i> Nuevo usuario
      </button>
    </div>

    <!-- Resumen por rol -->
    <div class="role-summary" id="roleSummary">
      <div class="rs-card">
        <span class="rs-count" id="countFuncionario">—</span>
        <span class="rs-label">FUNCIONARIO</span>
      </div>
      <div class="rs-card">
        <span class="rs-count" id="countViewer">—</span>
        <span class="rs-label">VIEWER</span>
      </div>
      <div class="rs-card">
        <span class="rs-count" id="countEditor">—</span>
        <span class="rs-label">EDITOR</span>
      </div>
      <div class="rs-card">
        <span class="rs-count" id="countTotal">—</span>
        <span class="rs-label">Total</span>
      </div>
    </div>

    <div class="table-wrap">
      <table class="users-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Vence</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="6" class="tbl-loading">
            <i class="fas fa-spinner fa-spin"></i> Cargando…
          </td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- ── Modal crear/editar ── -->
  <div id="userModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo usuario</h2>
        <button id="btnModalClose" class="modal-close" aria-label="Cerrar">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form id="userForm" novalidate>
        <input type="hidden" id="userId" />

        <div class="form-group">
          <label for="uNombre">Nombre completo</label>
          <input id="uNombre" type="text" class="form-input" required />
        </div>
        <div class="form-group">
          <label for="uEmail">Correo electrónico</label>
          <input id="uEmail" type="email" class="form-input" required />
        </div>
        <div class="form-group">
          <label for="uRol">Rol</label>
          <select id="uRol" class="form-input">
            <option value="VIEWER">VIEWER — Solo consulta básica</option>
            <option value="FUNCIONARIO">FUNCIONARIO — Herramientas técnicas</option>
            <option value="EDITOR">EDITOR — Control total + gestión</option>
          </select>
        </div>
        <div class="form-group">
          <label for="uPassword">
            Contraseña
            <span id="pwdHint" class="hint-inline">(dejar vacío para no cambiar)</span>
          </label>
          <input id="uPassword" type="password" class="form-input"
                 placeholder="Mínimo 8 caracteres" />
        </div>
        <div class="form-group">
          <label for="uExpiresAt">
            Vencimiento del acceso
            <span class="hint-inline">(opcional)</span>
          </label>
          <input id="uExpiresAt" type="date" class="form-input" />
        </div>

        <div id="modalError" class="login-error" hidden></div>

        <div class="modal-actions">
          <button type="button" id="btnModalCancel" class="btn-sm btn-ghost">Cancelar</button>
          <button type="submit"  id="btnModalSave"  class="btn-sm btn-primary">
            <span id="saveBtnText">Guardar</span>
            <span id="saveBtnSpinner" class="spinner" hidden></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="src/js/admin-users.js"></script>
</body>
</html>
